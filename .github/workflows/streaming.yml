name: Streaming invariants

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streaming-${{ github.ref }}
  cancel-in-progress: true

env:
  # crates.io index or crate downloads that fail transiently are retried instead of failing the job
  CARGO_NET_RETRY: "10"

jobs:
  streaming:
    name: Streaming E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Enforce grammar isolation and bounded state
        run: |
          python3 tools/streaming/check_invariants.py
          mkdir -p streaming-build
          rustc --edition=2024 --crate-type rlib tools/streaming/no_std.rs --out-dir streaming-build
          rustc --edition=2024 --crate-type rlib --target wasm32-unknown-unknown tools/streaming/no_std.rs --out-dir streaming-build
      - name: Build actual streaming entry point
        run: cargo build --locked --example stream_header --example stream_walk --example stream_lz77 --example stream_r2004 --example stream_r2004_maps --example stream_r2004_sections --example stream_r2004_file --example streaming_schedules
      - name: End-to-end header boundary acceptance
        run: python3 tools/streaming/verify.py target/debug/examples/stream_header target/debug/examples/streaming_schedules
      - name: End-to-end R13-R2000 container walk acceptance
        run: python3 tools/streaming/verify_walk.py target/debug/examples/stream_walk target/debug/examples/streaming_schedules
      - name: End-to-end R2004-family LZ77 decoder acceptance
        run: python3 tools/streaming/verify_lz77.py target/debug/examples/stream_lz77 target/debug/examples/streaming_schedules
      - name: End-to-end asynchronous byte source acceptance
        run: python3 tools/streaming/verify_source.py target/debug/examples/stream_walk
      - name: End-to-end R2004-family file header acceptance
        run: python3 tools/streaming/verify_r2004.py target/debug/examples/stream_r2004 target/debug/examples/streaming_schedules
      - name: End-to-end R2004-family page map and section map acceptance
        run: python3 tools/streaming/verify_maps.py target/debug/examples/stream_r2004_maps target/debug/examples/streaming_schedules
      - name: End-to-end R2004-family data page and section assembly acceptance
        run: python3 tools/streaming/verify_sections.py target/debug/examples/stream_r2004_sections target/debug/examples/streaming_schedules
      - name: End-to-end whole R2004-family file walk acceptance
        run: python3 tools/streaming/verify_file.py target/debug/examples/stream_r2004_file target/debug/examples/streaming_schedules
      - name: End-to-end cross-runtime checkpoint restore (native to wasm32 and back)
        run: python3 tools/streaming/verify_wasm.py target/debug/examples/stream_r2004_maps target/debug/examples/stream_r2004_sections target/debug/examples/stream_r2004_file
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: streaming-evidence
          path: |
            streaming-evidence.json
            streaming-schedules-*.jsonl
            walk-evidence.json
            walk-schedules-*.jsonl
            lz77-evidence.json
            lz77-schedules-*.jsonl
            source-evidence.json
            r2004-evidence.json
            r2004-schedules-*.jsonl
            map-evidence.json
            map-schedules-*.jsonl
            sections-evidence.json
            sections-schedules-*.jsonl
            file-evidence.json
            file-schedules-*.jsonl
            wasm-evidence.json
          if-no-files-found: error
