name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs on the same branch when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege at the workflow level. No job here modifies the
# repo, opens issues, comments on PRs, or otherwise needs write
# access; `contents: read` is enough. Individual jobs can request
# additional scopes with a per-job `permissions:` block if that
# ever changes.
permissions:
  contents: read

env:
  # crates.io index or crate downloads that fail transiently are retried instead of failing the job
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Install stable toolchain with rustfmt
        run: |
          rustup update stable
          rustup component add rustfmt --toolchain stable
      - name: cargo fmt --all -- --check
        run: cargo +stable fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Install stable toolchain with clippy
        run: |
          rustup update stable
          rustup component add clippy --toolchain stable
          rustup target add wasm32-unknown-unknown --toolchain stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: cargo clippy --all-targets --all-features -- -D warnings
        run: cargo +stable clippy --all-targets --all-features -- -D warnings
      # The wasm crate depends on this one by path, where a lint error in the
      # dependency is only a warning; check the library itself on 32 bits.
      - name: The library builds where usize is 32 bits
        run: cargo +stable check --lib --target wasm32-unknown-unknown

  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, "1.85"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Install ${{ matrix.toolchain }} toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: ${{ matrix.os }}-${{ matrix.toolchain }}
      - name: cargo build --release
        run: cargo +${{ matrix.toolchain }} build --release --all-features --all-targets
      - name: cargo test --release
        run: cargo +${{ matrix.toolchain }} test --release --all-features
      - name: The specification's worked examples (#107)
        run: cargo +${{ matrix.toolchain }} run --release --all-features --example spec_examples

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Install stable toolchain
        run: rustup update stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: cargo doc --no-deps --all-features
        run: cargo +stable doc --no-deps --all-features

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Install cargo-deny
        # Pinned for reproducibility. Bump deliberately in a separate PR.
        run: cargo install cargo-deny --version 0.19.4 --locked
      - name: cargo deny check all
        run: cargo deny check advisories bans licenses sources

  msrv:
    name: Verify MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Install 1.85 toolchain
        run: rustup toolchain install 1.85 --profile minimal
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: msrv
      - name: cargo check --all-features
        run: cargo +1.85 check --all-features

  coverage-smoke:
    name: Coverage smoke test (canonical corpus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Install stable toolchain
        run: rustup update stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      # The canonical corpus lives at tests/fixtures/canonical/ and is
      # committed to the repo — four self-generated, Apache-2.0
      # R2004-family files (one per version assemble_dwg_bytes supports)
      # produced by `cargo run --release --example build_fixtures`. See
      # tests/fixtures/canonical/README.md for provenance.
      #
      # Until task #94 this job skipped with a warning whenever the
      # directory held no .dwg file, which it always did — a vacuous
      # gate. A missing corpus is now a hard failure.
      - name: Assert the canonical corpus is present
        run: |
          set -e
          if [ ! -d tests/fixtures/canonical ] \
             || [ -z "$(find tests/fixtures/canonical -maxdepth 1 -name '*.dwg' -print -quit)" ]; then
            echo "::error::canonical corpus is empty — regenerate with \
          'cargo run --release --example build_fixtures' and commit the result"
            exit 1
          fi
          find tests/fixtures/canonical -maxdepth 1 -name '*.dwg' -print

      # Generation is byte-deterministic, so the committed fixtures must
      # equal what the current tree produces. A drifted corpus means the
      # writer changed without the fixtures being regenerated — at which
      # point the ratio below is measuring stale bytes.
      - name: Verify the committed corpus matches the generator
        run: |
          set -e
          cargo +stable run --release --example build_fixtures
          if ! git diff --exit-code -- tests/fixtures/canonical; then
            echo "::error::committed fixtures differ from build_fixtures output; \
          re-run 'cargo run --release --example build_fixtures' and commit the diff"
            exit 1
          fi

      - name: Run coverage_report and assert minimum decode ratio
        run: |
          set -e
          OUTPUT=$(cargo +stable run --release --example coverage_report -- tests/fixtures/canonical 2>&1)
          echo "$OUTPUT"
          # Extract the TOTAL row's ratio percentage (the last float on
          # that line). If the parse fails or the ratio drops below the
          # threshold below, fail the job.
          RATIO=$(echo "$OUTPUT" | awk '/^TOTAL/ { for (i=1;i<=NF;i++) if ($i ~ /^[0-9]+\.[0-9]+$/) last=$i } END { print last }')
          if [ -z "$RATIO" ]; then
            echo "::error::could not parse decoded_ratio from coverage_report"
            exit 1
          fi
          # MEASURED 2026-08-30 on the committed corpus: 20 entities
          # (5 per file × 4 files), 20 decoded / 0 unhandled / 0 errored
          # => aggregate decoded_ratio = 100.0%.
          #
          # The floor is the measured value minus one entity's worth of
          # margin (1/20 = 5.0 points) => 95.0. The margin is deliberately
          # this small: decoded_ratio is a deterministic function of the
          # committed bytes, not a timing measurement, so there is no CI
          # noise to absorb. It exists only so that adding a deliberately
          # unhandled object to the corpus (e.g. a DICTIONARY, to exercise
          # the Unhandled path) does not require editing this workflow in
          # the same commit.
          #
          # Raise this back to 100.0 if the corpus ever settles on a
          # fully-decodable object set. The tight gate lives in
          # tests/canonical_corpus.rs, which pins the exact per-file
          # counts AND the decoded field values under `cargo test`.
          THRESHOLD=95.0
          PASS=$(awk -v r="$RATIO" -v t="$THRESHOLD" 'BEGIN { print (r+0 >= t+0) ? "1" : "0" }')
          if [ "$PASS" != "1" ]; then
            echo "::error::decoded_ratio $RATIO% < $THRESHOLD% minimum threshold"
            exit 1
          fi
          echo "coverage-smoke PASS: decoded_ratio=$RATIO% (threshold ${THRESHOLD}%)"

      # Walker-completeness gate (#56). AcDb:Classes records how many
      # instances of each custom class a drawing holds (DXF group 91),
      # which makes the class table a free oracle: a walk that reaches
      # fewer objects of a class than the file declares is missing
      # records. examples/probe_class_census exits non-zero on any
      # under-walk.
      #
      # --strict disables the sample-corpus allowlist (TABLECONTENT /
      # TABLEGEOMETRY on sample_AC1032.dwg, see the probe's ALLOWLIST
      # docs). It must never be needed here: the canonical fixtures are
      # self-generated, so their census has to be exact. The tight
      # per-fixture assertion lives in tests/canonical_corpus.rs; the
      # public corpus is censused by the `corpus` job below.
      - name: Class census must be exact on every canonical fixture
        run: |
          set -e
          for f in tests/fixtures/canonical/*.dwg; do
            echo "== $f"
            cargo +stable run --release --example probe_class_census -- "$f" --strict
          done

      # Walk-closure gate (#76/#77). The class census says *whether* a
      # class is short; this says whether a missing record could exist
      # at all. It fails if any two walked records leave bytes between
      # them (room an unreferenced record could occupy) or if any hard
      # handle reference resolves to nothing.
      - name: The object walk must be closed on every canonical fixture
        run: |
          set -e
          for f in tests/fixtures/canonical/*.dwg; do
            echo "== $f"
            cargo +stable run --release --example probe_reference_closure -- "$f"
          done

  corpus:
    # The reader measured on public drawings anyone can fetch (#94). Every
    # file is fetched for the run at a pinned commit and checked against its
    # pinned sha256 (tools/corpus/pins.tsv); none is committed. The tests that
    # skip without a corpus run on the 19 files they are written for, and
    # every pinned drawing is measured against tools/corpus/baseline.tsv,
    # which must match exactly (#95, #97).
    name: Corpus (public DWG)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Install stable toolchain
        run: rustup update stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: corpus
      - name: Restore the fetched corpus
        id: corpus-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/dwg-corpus
          key: dwg-corpus-${{ hashFiles('tools/corpus/pins.tsv') }}
      # Exit 1 (a file differs from its pin, or its commit no longer serves
      # it) fails the job. Exit 69 (host unreachable after every retry on
      # both routes) is reported as NOT MEASURED instead of a red X, and
      # every measuring step below is skipped.
      - name: Fetch and verify every pinned file
        id: fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # The streaming E2E pins some of the same files; they must agree.
          shopt -s nullglob
          others=(tools/streaming/*-corpus.json)
          set +e
          python3 -I tools/corpus/fetch.py --dest "$HOME/dwg-corpus" \
            --legacy-samples "$GITHUB_WORKSPACE/../../samples" --cross-check "${others[@]}"
          status=$?
          set -e
          if [ "$status" -eq 69 ]; then
            echo "::warning::NOT MEASURED: the corpus host was unreachable after every retry"
            {
              echo "## Corpus: NOT MEASURED"
              echo
              echo "The corpus host was unreachable after every retry; no real drawing was read on this run."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "measured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          echo "measured=true" >> "$GITHUB_OUTPUT"
      - name: Save the fetched corpus
        if: steps.fetch.outputs.measured == 'true' && steps.corpus-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/dwg-corpus
          key: dwg-corpus-${{ hashFiles('tools/corpus/pins.tsv') }}
      # tests/samples.rs, class_census.rs, block_names.rs, corpus_roundtrip.rs
      # and r2013_entity_values.rs read ../../samples and skip silently when a
      # file is absent, so a skip here would be a vacuous pass.
      - name: Real-file tests on the 19-file corpus
        if: steps.fetch.outputs.measured == 'true'
        run: |
          set +e
          cargo +stable test --release --all-features --test samples --test class_census \
            --test block_names --test corpus_roundtrip --test r2013_entity_values \
            -- --nocapture > corpus-tests.log 2>&1
          status=$?
          set -e
          cat corpus-tests.log
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -n -i 'skipping' corpus-tests.log; then
            echo "::error::a corpus test skipped although the corpus is present"
            exit 1
          fi
      - name: Measure every pinned drawing and check the ratchet
        if: steps.fetch.outputs.measured == 'true'
        run: |
          cargo +stable build --release --features dxf-reader --example coverage_report \
            --example probe_class_census --example probe_reference_closure --example dxf_oracle
          set +e
          python3 -I tools/corpus/measure.py run --corpus "$HOME/dwg-corpus" \
            --bin target/release/examples --out corpus-results.json --logs corpus-logs
          run_status=$?
          python3 -I tools/corpus/measure.py check --results corpus-results.json \
            --summary "$GITHUB_STEP_SUMMARY" --proposed baseline.tsv
          check_status=$?
          set -e
          if [ "$run_status" -ne 0 ] || [ "$check_status" -ne 0 ]; then
            exit 1
          fi
      # Every Reed-Solomon codeword of every pinned R2007 drawing (§5.13, #275):
      # intact, re-encoded to AutoCAD's parity, and corrected after damage.
      - name: Reed-Solomon on every R2007 page
        if: steps.fetch.outputs.measured == 'true'
        run: |
          set +e
          cargo +stable run --release --example probe_r2007_rs -- "$HOME/dwg-corpus" > rs-probe.log 2>&1
          status=$?
          set -e
          cat rs-probe.log
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -q '^NOT MEASURED' rs-probe.log; then
            echo "::error::no pinned R2007 drawing reached the Reed-Solomon probe"
            exit 1
          fi
      # The §4.6 data page header as AutoCAD writes it (#205): every data page
      # of every pinned R2004-family drawing, against the page map and section map.
      - name: Data page headers on every R2004-family page
        if: steps.fetch.outputs.measured == 'true'
        run: |
          set +e
          cargo +stable run --release --example probe_data_page_header -- --strict "$HOME/dwg-corpus" > dph-probe.log 2>&1
          status=$?
          set -e
          cat dph-probe.log
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -q '^NOT MEASURED' dph-probe.log; then
            echo "::error::no pinned R2004-family drawing reached the data page probe"
            exit 1
          fi
      # The DXF value oracle (#99, #103): every DWG record paired by handle
      # with AutoCAD's own DXF export of the same drawing, and every decoded
      # field compared with its DXF group. tools/oracle/baseline.tsv holds
      # the agreeing values per release, type, field and group; a count
      # that falls, or a row that disappears, fails the job. A change that
      # raises, adds or renames a row commits the regenerated TSV (uploaded
      # below as oracle.tsv) in the same pull request.
      - name: DXF value oracle and its ratchet
        if: steps.fetch.outputs.measured == 'true'
        run: |
          set +e
          target/release/examples/dxf_oracle "$HOME/dwg-corpus" --tsv oracle.tsv \
            --summary oracle-summary.md --baseline tools/oracle/baseline.tsv > oracle.log 2>&1
          status=$?
          set -e
          if [ -f oracle-summary.md ]; then
            cat oracle-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          sed -n '/== Pairing by handle/,/== Field agreement/p;/== Disagreements/,/== DXF groups/p;/== Ratchet/,$p' oracle.log
          exit "$status"
      # Every header variable of every pinned drawing (§9, #126): the frame, the
      # CRC and every stream boundary, then each variable against AutoCAD's own
      # DXF export of the same drawing.
      - name: Header variables against the DXF exports
        if: steps.fetch.outputs.measured == 'true'
        run: |
          set +e
          cargo +stable run --release --features dxf-reader --example probe_header_vars -- "$HOME/dwg-corpus" > header-probe.log 2>&1
          status=$?
          set -e
          cat header-probe.log
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -q '^NOT MEASURED' header-probe.log; then
            echo "::error::no pinned drawing reached the header decoder"
            exit 1
          fi
      # dwg-to-dxf's HEADER against AutoCAD's own export of the same drawing
      # (#126): every variable it writes must agree, and none AutoCAD omits.
      - name: DXF HEADER written by dwg-to-dxf against the DXF exports
        if: steps.fetch.outputs.measured == 'true'
        run: |
          set +e
          cargo +stable run --release --features dxf-reader --example probe_dxf_header -- "$HOME/dwg-corpus" > dxf-header-probe.log 2>&1
          status=$?
          set -e
          cat dxf-header-probe.log
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -q '^NOT MEASURED' dxf-header-probe.log; then
            echo "::error::no pinned drawing reached the DXF HEADER probe"
            exit 1
          fi
      # dwg-to-dxf's TABLES against AutoCAD's own export of the same drawing:
      # every record written pairs with the export's, group for group.
      - name: DXF TABLES written by dwg-to-dxf against the DXF exports
        if: steps.fetch.outputs.measured == 'true'
        run: |
          set +e
          cargo +stable run --release --features dxf-reader --example probe_dxf_tables -- "$HOME/dwg-corpus" > dxf-tables-probe.log 2>&1
          status=$?
          set -e
          cat dxf-tables-probe.log
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -q '^NOT MEASURED' dxf-tables-probe.log; then
            echo "::error::no pinned drawing reached the DXF TABLES probe"
            exit 1
          fi
      # The entity colour's true colour and transparency words against
      # AutoCAD's own export of the same drawing (ARCHITECTURE.md 7al).
      - name: Entity colour words against the DXF exports
        if: steps.fetch.outputs.measured == 'true'
        run: |
          set +e
          cargo +stable run --release --features dxf-reader --example probe_entity_colour -- "$HOME/dwg-corpus" > entity-colour-probe.log 2>&1
          status=$?
          set -e
          cat entity-colour-probe.log
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -q '^NOT MEASURED' entity-colour-probe.log; then
            echo "::error::no pinned drawing reached the entity colour probe"
            exit 1
          fi
      # Pre-R2007 text in the code page the file header names (#370,
      # ARCHITECTURE.md 7ao): the header short against each export's
      # $DWGCODEPAGE, every string the corpus decodes, and an in-memory copy of
      # each uncompressed drawing with non-ASCII bytes written over a string.
      - name: Code page of pre-R2007 text against the DXF exports
        if: steps.fetch.outputs.measured == 'true'
        run: |
          set +e
          cargo +stable run --release --example probe_code_page -- "$HOME/dwg-corpus" > code-page-probe.log 2>&1
          status=$?
          set -e
          cat code-page-probe.log
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -q '^NOT MEASURED' code-page-probe.log; then
            echo "::error::no pinned drawing reached the code page probe"
            exit 1
          fi
      # The insert-count run of every BLOCK_HEADER against the record's own handle
      # stream: the run ends the same count of handles the stream holds.
      - name: BLOCK_HEADER insert-count run against the handle stream
        if: steps.fetch.outputs.measured == 'true'
        run: |
          set +e
          cargo +stable run --release --example probe_block_header_inserts -- "$HOME/dwg-corpus" > block-header-inserts-probe.log 2>&1
          status=$?
          set -e
          cat block-header-inserts-probe.log
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -q '^NOT MEASURED' block-header-inserts-probe.log; then
            echo "::error::no pinned drawing reached the BLOCK_HEADER insert-count probe"
            exit 1
          fi
      # dwg-to-dxf's ENTITIES against AutoCAD's own export of the same drawing:
      # every entity written pairs with the export's, group for group.
      - name: DXF ENTITIES written by dwg-to-dxf against the DXF exports
        if: steps.fetch.outputs.measured == 'true'
        run: |
          set +e
          cargo +stable run --release --features dxf-reader --example probe_dxf_entities -- "$HOME/dwg-corpus" > dxf-entities-probe.log 2>&1
          status=$?
          set -e
          cat dxf-entities-probe.log
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -q '^NOT MEASURED' dxf-entities-probe.log; then
            echo "::error::no pinned drawing reached the DXF ENTITIES probe"
            exit 1
          fi
      # dwg-to-dxf's CLASSES against AutoCAD's own export of the same drawing:
      # every class written pairs with the export's, group for group, in its order.
      - name: DXF CLASSES written by dwg-to-dxf against the DXF exports
        if: steps.fetch.outputs.measured == 'true'
        run: |
          set +e
          cargo +stable run --release --features dxf-reader --example probe_dxf_classes -- "$HOME/dwg-corpus" > dxf-classes-probe.log 2>&1
          status=$?
          set -e
          cat dxf-classes-probe.log
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -q '^NOT MEASURED' dxf-classes-probe.log; then
            echo "::error::no pinned drawing reached the DXF CLASSES probe"
            exit 1
          fi
      # The same probe on BLOCKS: every block record's BLOCK, entities and ENDBLK.
      - name: DXF BLOCKS written by dwg-to-dxf against the DXF exports
        if: steps.fetch.outputs.measured == 'true'
        run: |
          set +e
          cargo +stable run --release --features dxf-reader --example probe_dxf_entities -- --section=BLOCKS "$HOME/dwg-corpus" > dxf-blocks-probe.log 2>&1
          status=$?
          set -e
          cat dxf-blocks-probe.log
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -q '^NOT MEASURED' dxf-blocks-probe.log; then
            echo "::error::no pinned drawing reached the DXF BLOCKS probe"
            exit 1
          fi
      # dwg-to-dxf's OBJECTS against AutoCAD's own export of the same drawing:
      # every record written pairs with the export's, group for group, in its order.
      - name: DXF OBJECTS written by dwg-to-dxf against the DXF exports
        if: steps.fetch.outputs.measured == 'true'
        run: |
          set +e
          cargo +stable run --release --features dxf-reader --example probe_dxf_objects -- "$HOME/dwg-corpus" > dxf-objects-probe.log 2>&1
          status=$?
          set -e
          cat dxf-objects-probe.log
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -q '^NOT MEASURED' dxf-objects-probe.log; then
            echo "::error::no pinned drawing reached the DXF OBJECTS probe"
            exit 1
          fi
      # Measurements and the baseline a change would need; never a sample file.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.fetch.outputs.measured == 'true'
        with:
          name: corpus-measurement
          path: |
            oracle.tsv
            oracle.log
            oracle-summary.md
            corpus-results.json
            corpus-logs/
            corpus-tests.log
            header-probe.log
            dxf-header-probe.log
            dxf-tables-probe.log
            dxf-entities-probe.log
            dxf-blocks-probe.log
            baseline.tsv
          if-no-files-found: warn

  spec-coverage:
    name: Spec coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      # docs/spec-coverage.md must have a row for every section of ODA spec
      # v5.4.1 and agree with docs/data/spec-coverage.tsv (#105).
      - name: Every spec section has a row, and the page matches its data
        run: python3 tools/ci/spec_coverage.py --check
      # Lanes land ARCHITECTURE.md sections in parallel with strict
      # up-to-date off, so two PRs can each add the same `## 7x.`.
      - name: ARCHITECTURE.md's numbered sections run in order
        run: python3 tools/maintainer/train/arch.py check

  pii-guard:
    name: PII guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      # A conflict marker left by a hand-resolved merge or rebase (two reached
      # main on 2026-10-26). `=======` alone is not matched: it is also a
      # Markdown heading underline.
      - name: No merge-conflict markers
        run: |
          if git grep -I -n -E '^(<<<<<<<|\|\|\|\|\|\|\||>>>>>>>)( |$)' -- .; then
            echo "::error::a merge-conflict marker is committed"
            exit 1
          fi
      - name: Scan for PII-shaped leak patterns
        run: |
          set -e
          echo "Scanning repo for patterns that must never be committed..."
          # Each regex catches a *class* of PII without spelling out
          # any specific sensitive value. Broad by design — belt-and-
          # suspenders over local hygiene.
          PATTERNS=(
            # Absolute home paths (macOS, Linux, Windows).
            '/Users/[a-z][a-z0-9._-]+/'
            '/home/[a-z][a-z0-9._-]+/'
            'C:\\Users\\[a-z][a-z0-9._-]+\\'
            # Autodesk build-server paths baked into released DLLs.
            'F:\\Ship\\[0-9]{4}_'
            # Employee OneDrive authoring paths.
            'OneDrive - Autodesk\\[^\\]*\\'
          )
          failed=0
          for p in "${PATTERNS[@]}"; do
            if git grep -I -n -P "$p" -- ':!.github/workflows/' 2>/dev/null; then
              echo "::error::PII-shaped pattern matched: $p"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "PII guard: clean."

  secret-scan:
    # Secret-scanning sits alongside PII-guard but casts a wider net:
    # PII-guard is hand-crafted regexes for the small set of path
    # shapes that have actually leaked into this project in the past;
    # gitleaks covers the broader landscape of API keys, OAuth
    # tokens, cloud credentials, and private keys that a contributor
    # might accidentally commit.
    #
    # SARIF output is uploaded to the GitHub Security tab so findings
    # are visible to maintainers without noise on every PR's check
    # summary.
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # Full history — gitleaks should scan every commit, not
          # just the tip.
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fail the CI job if anything matches; separately, upload
          # findings to GitHub Code Scanning so they surface in the
          # Security tab.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
