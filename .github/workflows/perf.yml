name: Perf

# Early-warning performance-regression gate. This is NOT the place
# where serious perf work gets validated — it's a "canary that
# screams when a PR makes `section_map`, `object_walk`,
# `metadata_parse`, or `libredwg_compare` >20 % slower than the
# baseline on `main`".
#
# How it works:
#   - push to `main` saves a criterion baseline named `main` to a
#     GitHub Actions cache keyed on the workflow file's SHA so that
#     changes to the benchmark set invalidate stale baselines.
#   - pull_request runs the same benches and compares against the
#     cached `main` baseline by reading criterion's own
#     `estimates.json` files. The comparison table is printed on every
#     run. If no baseline is cached yet (first run, or cache miss) the
#     comparison is skipped with a warning — we never want first-time
#     contributors to hit a red X because the cache is cold.
#
# ---------------------------------------------------------------------
# Failure rule (issue #17) — ratio AND absolute delta AND a re-run
# ---------------------------------------------------------------------
#
# A bench fails the job only when ALL THREE hold:
#
#   1. ratio  = pr_mean / main_mean  >=  RATIO_THRESHOLD (1.20)
#   2. delta  = pr_mean - main_mean  >=  ABS_FLOOR_NS    (5 000 ns)
#   3. the same bench trips (1) and (2) again on an immediate re-run.
#
# Why the ratio alone was not enough: issue #17 recorded
# `stage1_build_section/uniform_16k` at ratio 1.24 on PR #13 — a PR
# that touched neither `src/lz77_encode.rs` nor `src/file_writer.rs` —
# while three sibling cells in the SAME run *improved* by 10-17 %. A
# whole-group swing in both directions is the signature of runner
# noise, not of a code change. On a shared GitHub vCPU a 21 µs bench
# routinely moves double digits.
#
# ABS_FLOOR_NS = 5 000 ns (5 µs). Rationale: the cells small enough for
# 20 % to fall under that floor (alt_1k ~1.7 µs, uniform_16k ~21 µs)
# exercise exactly the same `WriterScaffold::build_sections` code path
# as `mixed_64k` (~100 µs) and `mixed_256k` (~334 µs), which stay
# gated because 20 % of them is 20-67 µs. So no code path loses
# coverage — a real algorithmic regression still fails the job on the
# large cells. What the floor removes is the class of failure where the
# only evidence is a few microseconds on the smallest cell.
#
# The re-run costs nothing on the happy path: it only executes when a
# bench has already tripped (1) and (2).
#
# ---------------------------------------------------------------------
# Methodology note — how to check a suspected regression by hand
# ---------------------------------------------------------------------
#
# Criterion's headline number (mean / slope) is an average over ~100
# samples, so anything else running on the machine inflates it. Local
# evidence gathered for #17 on 2026-08-30, an M2 Max under a load
# average of ~12, `stage1_build_section/uniform_16k`:
#
#   criterion mean, same binary, two runs ....... 21.25 µs → 32.99 µs (+55 %)
#   minimum of the SAME samples ................. 20.80 µs → 21.82 µs (+4.9 %)
#
# The minimum per-iteration time is the sample that came closest to
# running uncontended, and it is far steadier. Extract it from
# criterion's raw samples:
#
#   jq '[ [.iters, .times] | transpose[] | .[1]/.[0] ] | min' \
#     target/criterion/<group>/<cell>/<baseline>/sample.json
#
# The same six-way A/B matrix (rolled vs 8-way-unrolled+`#[inline(never)]`
# checksum × with/without an unrelated function added to
# `src/bitwriter.rs`) landed entirely inside 20.80-21.89 µs with no
# consistent ordering by build — i.e. the "+24 % from code layout"
# reported in #17 did not survive the better estimator. That is why the
# fix here is a CI-side rule and not a code change.
#
# 20 % is a conservative ratio for a pre-alpha crate where the
# benchmarks are small enough that CI noise can spike double-digit
# percentages on cold runners. Once the crate has a published
# baseline in the 0.2 era, tighten this to 10 % (#417 follow-up).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  # Benches measure `pub fn` hot paths; warnings-as-errors during
  # the bench build keeps the compile envelope identical to `ci.yml`.
  RUSTFLAGS: "-D warnings"

jobs:
  bench:
    name: Criterion benches vs `main` baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          # Keep the perf cache separate from test caches so a flaky
          # bench build never pollutes the test cache.
          key: perf-${{ runner.os }}

      # No critcmp install any more: `.github/scripts/criterion-gate.sh`
      # reads criterion's own `estimates.json` with `jq` (preinstalled on
      # ubuntu-latest). That drops a ~1-minute `cargo install` from every
      # run, removes a text-scraping parse that would silently
      # mis-attribute a column if critcmp's layout ever changed, and
      # gives the gate the absolute nanosecond delta it needs for the
      # noise floor described at the top of this file.

      # --------------------------------------------------------------
      # Baseline caching: keyed on this workflow file + Cargo.lock +
      # the bench source files. Any change to them invalidates the
      # stored `main` baseline so we never compare apples to oranges.
      # --------------------------------------------------------------
      - name: Restore cached `main` baseline
        id: baseline-restore
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: target/criterion
          key: criterion-baseline-${{ hashFiles('.github/workflows/perf.yml', 'Cargo.lock', 'benches/**/*.rs') }}

      - name: Run benches
        run: |
          set -euo pipefail
          # All six `[[bench]]` targets: lz77, section_map, object_walk,
          # metadata_parse, libredwg_compare, write_path.
          #
          # On push-to-main we record this run as the new baseline.
          # On PRs we record it as "pr" so the gate script can diff
          # against the cached "main".
          BASELINE_NAME="pr"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            BASELINE_NAME="main"
          fi
          echo "Recording baseline: ${BASELINE_NAME}"
          .github/scripts/run-benches.sh "${BASELINE_NAME}"

      - name: Compare PR vs baseline
        if: github.event_name == 'pull_request'
        env:
          RATIO_THRESHOLD: "1.20"
          # 5 µs. See the failure-rule comment at the top of this file
          # for why the ratio is paired with an absolute floor, and why
          # 5 µs specifically.
          ABS_FLOOR_NS: "5000"
        run: |
          set -uo pipefail
          # GitHub's default shell is `bash -e`; the gate script signals
          # its verdict through the exit status, so errexit must be off
          # for the `$?` checks below to be reachable.
          set +e
          if [ ! -d target/criterion ] || [ -z "$(find target/criterion -name 'benchmark.json' -print -quit 2>/dev/null)" ]; then
            echo "::warning::no criterion output found; skipping compare"
            exit 0
          fi

          # Pass 1. Exit 2 means the cached `main` baseline is absent
          # (cold cache, first PR ever) — a warning, never a red X,
          # because the PR author cannot fix a cold cache.
          .github/scripts/criterion-gate.sh main pr /tmp/tripped-1.txt
          STATUS=$?
          if [ "$STATUS" -eq 0 ]; then
            echo "All benches within ${RATIO_THRESHOLD}x of the main baseline."
            exit 0
          fi
          if [ "$STATUS" -eq 2 ]; then
            echo "::warning::no cached 'main' baseline to compare against — likely first run"
            exit 0
          fi
          if [ "$STATUS" -ne 1 ]; then
            echo "::error::criterion-gate.sh failed with status $STATUS"
            exit 1
          fi

          # Pass 2 — the "two consecutive runs" requirement from #17.
          # Something tripped both thresholds; re-measure before
          # believing it. Only a bench that trips in BOTH runs fails the
          # job, so a one-off runner hiccup is reported and forgiven.
          echo "::notice::pass 1 flagged a regression; re-running the benches to confirm"
          .github/scripts/run-benches.sh pr2

          .github/scripts/criterion-gate.sh main pr2 /tmp/tripped-2.txt
          STATUS=$?
          if [ "$STATUS" -eq 0 ]; then
            echo "::warning::pass 1 flagged a regression but the re-run was clean; treating pass 1 as runner noise"
            exit 0
          fi
          if [ "$STATUS" -ne 1 ]; then
            echo "::error::criterion-gate.sh failed with status $STATUS on the re-run"
            exit 1
          fi

          CONFIRMED=$(sort /tmp/tripped-1.txt /tmp/tripped-2.txt | uniq -d)
          if [ -z "$CONFIRMED" ]; then
            echo "::warning::both passes flagged regressions, but no single benchmark twice; treating as runner noise"
            exit 0
          fi
          echo "$CONFIRMED" | while IFS= read -r NAME; do
            echo "::error::${NAME} regressed >=${RATIO_THRESHOLD}x AND >=${ABS_FLOOR_NS}ns vs main on two consecutive runs"
          done
          exit 1

      # --------------------------------------------------------------
      # Cache the new `main` baseline on push-to-main ONLY. PR runs
      # never write the cache — otherwise a PR that regresses perf
      # would poison future PRs' baselines.
      # --------------------------------------------------------------
      - name: Save `main` baseline cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: target/criterion
          key: criterion-baseline-${{ hashFiles('.github/workflows/perf.yml', 'Cargo.lock', 'benches/**/*.rs') }}
